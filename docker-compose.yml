# 一键部署：应用 + PostgreSQL + Nginx
#
# 用法：
#   1. cp env.example .env.docker  然后改里面的密码和域名
#   2. docker compose --env-file .env.docker up -d --build
#   3. 首次部署要初始化数据库：
#      docker compose exec app npx prisma db push
#      docker compose exec app node --experimental-strip-types prisma/seed.ts   # 可选，写入演示数据
#
# 说明：数据库和上传目录都用具名 volume 持久化，重建容器不会丢数据。

services:
  postgres:
    image: postgres:16
    container_name: fang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fang_site}
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    # 只暴露给宿主机本机，不对外网开放数据库端口（安全考虑）
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fang} -d ${POSTGRES_DB:-fang_site}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # next build 会预渲染首页，那一步要连库；连接串用 BuildKit secret 传，不进镜像层
      secrets:
        - dburl
    container_name: fang-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fang}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fang_site}
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
      NEXT_PUBLIC_CITY: ${NEXT_PUBLIC_CITY}
      REF_COOKIE_DAYS: ${REF_COOKIE_DAYS:-90}
      TZ: Asia/Shanghai
    volumes:
      # 房源图片、微信二维码等上传文件，必须持久化
      - uploads:/app/public/uploads
      - ./prisma:/app/prisma
    ports:
      - '127.0.0.1:3000:3000'

  # 可选：如果服务器上还没有 Nginx，用这个容器做反向代理
  nginx:
    image: nginx:1.27-alpine
    container_name: fang-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - '80:80'
      - '443:443'
    profiles: ['with-nginx']

volumes:
  pg-data:
  uploads:

secrets:
  # 从当前 shell 的 DATABASE_URL 读取；构建前先 export DATABASE_URL=postgresql://...
  dburl:
    environment: DATABASE_URL
