# 二手房网站 Nginx 反向代理配置
# 放到 /etc/nginx/conf.d/fang.conf（宿主机 Nginx）
# 或项目 deploy/nginx.conf（用 docker compose 的 nginx 容器）

upstream fang_app {
    server 127.0.0.1:3000;          # 宿主机部署
    # server app:3000;              # docker compose 内部署时用这一行
    keepalive 32;
}

# HTTP 跳 HTTPS
server {
    listen 80;
    server_name www.你的域名.com 你的域名.com;

    # 申请 SSL 证书时用这个目录（certbot --webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.你的域名.com 你的域名.com;

    # ===== 证书（用 certbot 申请后路径一般如下）=====
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # ===== 安全响应头 =====
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传图片体积上限（房源图片走 Server Action，必须放宽）
    client_max_body_size 30m;
    client_body_timeout 120s;

    # ===== 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ===== 房源图片：由 Nginx 直接读文件，不经过 Node =====
    # 注意：应用把图片存在 public/uploads 下
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ===== 静态资源长缓存 =====
    location /_next/static/ {
        proxy_pass http://fang_app;
        proxy_cache_valid 200 30d;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== 健康检查不写日志 =====
    location = /api/health {
        proxy_pass http://fang_app;
        access_log off;
    }

    # ===== 其它请求交给 Next.js =====
    location / {
        proxy_pass http://fang_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 应用靠这个头识别客户真实 IP（归属统计要用）
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
